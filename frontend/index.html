<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AFSIM Agent</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div><h1>AFSIM Agent</h1><p id="healthText">checking</p></div>
        <button id="refreshHistory" type="button">刷新历史</button>
      </header>

      <section class="status-panel standalone-status">
        <div class="panel-head">
          <h2>任务状态</h2>
          <div class="panel-actions"><span id="stateBadge" class="badge">idle</span><button id="cancelTask" type="button">取消当前任务</button></div>
        </div>
        <dl class="meta">
          <div><dt>会话</dt><dd id="conversationId">未选择</dd></div>
          <div><dt>Task ID</dt><dd id="taskId">-</dd></div>
          <div><dt>创建时间</dt><dd id="createdAt">-</dd></div>
        </dl>
        <div class="current-request">
          <div class="request-label">当前请求</div>
          <pre id="currentRequest">暂无请求</pre>
        </div>
        <div class="flow" id="flowState" aria-label="当前执行流程">
          <div class="flow-step waiting" data-step="submit"><span>1</span><strong>提交</strong><em>等待任务</em></div>
          <div class="flow-step waiting" data-step="generate"><span>2</span><strong>生成脚本</strong><em>等待</em></div>
          <div class="flow-step waiting" data-step="execute"><span>3</span><strong>执行 mission</strong><em>等待</em></div>
          <div class="flow-step waiting" data-step="fix"><span>4</span><strong>匹配/修复</strong><em>等待</em></div>
          <div class="flow-step waiting" data-step="done"><span>5</span><strong>完成</strong><em>等待</em></div>
        </div>
        <pre id="resultBox" class="output">{}</pre>
      </section>

      <section class="conversation-workspace">
        <div class="conversation-controls">
          <div class="panel-head"><h2>新建会话</h2><span id="convState" class="badge">未创建</span></div>
          <label class="script-mode"><input id="convScriptMode" type="checkbox" /> 使用已有脚本</label>
          <textarea id="convCreateInput" spellcheck="false" placeholder="输入初始需求，或勾选“使用已有脚本”后粘贴 AFSIM 脚本"></textarea>
          <label>mission 选项<input id="convCreateOptions" value="-es" /></label>
          <button class="primary" id="createConv" type="button">创建会话</button>
          <div id="conversationInfo" class="hint">创建完成后，可以继续提交修改。</div>
          <div id="turnComposer" class="turn-composer" hidden>
            <label for="convInstruction">下一轮修改</label>
            <textarea id="convInstruction" placeholder="例如：给蓝方战斗机增加一个航路点，并保持速度为 450 kts"></textarea>
            <button class="primary" id="submitTurn" type="button">提交下一轮修改</button>
            <button id="finishConv" type="button">结束会话</button>
          </div>
        </div>

        <div class="current-script-panel">
          <div class="panel-head"><div><h2>当前脚本</h2><p id="conversationMeta" class="hint">暂无脚本</p></div><button id="copyScript" type="button">复制</button></div>
          <pre id="scriptBox" class="output script-output">暂无脚本</pre>
        </div>
      </section>

      <section class="history-panel data-panel">
        <div class="panel-head"><h2>历史记录</h2><span id="historyTotal" class="muted">0</span></div>
        <div id="historyBox" class="list empty">暂无记录</div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
